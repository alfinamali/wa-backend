{% extends "base_error_page.html" %}
{% load i18n static %}

{% block title %}500 - Kesalahan Server{% endblock %}

{% block error_content %}
<h1 class="mb-2 mx-2" style="font-size: 6rem;line-height: 6rem;">500</h1>
<h4 class="mb-2">Internal server error 🔐</h4>
<p class="mb-3 mx-2">Oops somthing went wrong.</p>
<div class="d-flex justify-content-center mt-12">
  <img src="{% static 'materialize_admin/assets/img/illustrations/misc-error-object.png' %}" alt="misc-server-error" class="img-fluid misc-object d-none d-lg-inline-block" width="160">
  <img src="{% static 'materialize_admin/assets/img/illustrations/misc-bg-light.png' %}" alt="misc-server-error" class="misc-bg d-none d-lg-inline-block z-n1" data-app-light-img="illustrations/misc-bg-light.png" data-app-dark-img="illustrations/misc-bg-dark.png" style="visibility: visible;">
  <div class="d-flex flex-column align-items-center">
    <img src="{% static 'materialize_admin/assets/img/illustrations/misc-server-error-illustration.png' %}" alt="misc-server-error" class="img-fluid z-1" width="230">
    <div>
      <a href="{% url 'admin:index' %}" class="btn btn-primary text-center my-10 waves-effect waves-light">Back to home</a>
    </div>
  </div>
</div>
{% endblock %}
