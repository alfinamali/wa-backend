{% load i18n %}

<div class="col-md-6 mb-3">
  
  <!-- Title -->
  <div class="mb-2">
    <h6 class="mb-0">
      {% blocktrans with filter_title=title %}
        By {{ filter_title }}
      {% endblocktrans %}
    </h6>
  </div>

  <!-- Select -->
  <select
    class="form-select select2 w-100"
    data-placeholder="{% trans 'Pilih' %} {{ title }}"
    onchange="if (this.value) window.location.href=this.value;"
  >
    <option value="">
      -- {% trans "Semua" %} {{ title }} --
    </option>

    {% for choice in choices %}
      <option
        value="{{ choice.query_string|iriencode }}"
        {% if choice.selected %}selected{% endif %}
      >
        {{ choice.display }}
      </option>
    {% endfor %}
  </select>

</div>
