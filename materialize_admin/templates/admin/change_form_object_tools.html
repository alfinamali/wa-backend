{% load i18n admin_urls %}

{% block object-tools-items %}
{% url opts|admin_urlname:'history' original.pk|admin_urlquote as history_url %}
<li>
  <a class="dropdown-item" href="{% add_preserved_filters history_url %}">{% trans 'History' %}</a>
</li>
{% comment %} {% if has_absolute_url %}
  <a href="{{ absolute_url }}" class="btn btn-secondary btn-sm waves-effect waves-light">{% trans "View on site" %}</a>
{% endif %} {% endcomment %}
{% endblock %}
