{% load i18n %}
<div class="card">
  <div class="card-content">
    <table class=" table highlight responsive-table">
      <thead>
        <tr>
          <td colspan="2" class=""><b>{% trans "Summary" %}</b></td>
        </tr>
      </thead>
      <tbody>
      {% for model_name, object_count in model_count %}
          <tr>
              <td>{{ model_name|capfirst }}</td>
              <td>{{ object_count }}</td>
          </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
