services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-wa}
      POSTGRES_USER: ${DB_USER:-wa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wa}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
volumes:
  pgdata:
